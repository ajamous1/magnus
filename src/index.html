<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnus</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="bento-grid">
        <div class="bento-row" id="top-row">
            <div class="bento-panel" id="panel-shooter">
                <button class="panel-fs-btn" title="Toggle fullscreen">
                    <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                    <svg class="icon-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 14h6v6M20 10h-6V4M10 14l-7 7M14 10l7-7"/></svg>
                </button>
                <canvas class="webgl"></canvas>
            </div>
            <div class="resize-handle resize-v"></div>
            <div class="bento-panel" id="panel-customizer">
                <button class="panel-fs-btn" title="Toggle fullscreen">
                    <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                    <svg class="icon-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 14h6v6M20 10h-6V4M10 14l-7 7M14 10l7-7"/></svg>
                </button>
                <div class="customizer-viewport">
                    <canvas class="customizer-preview"></canvas>
                </div>
                <div class="customizer-controls">
                    <div class="control-group">
                        <span class="control-label">Design</span>
                        <div class="design-buttons">
                            <button class="design-btn active" data-design="classic">Classic</button>
                            <button class="design-btn" data-design="jabulani">Jabulani</button>
                            <button class="design-btn" data-design="brazuca">Brazuca</button>
                        </div>
                    </div>
                    <div class="control-group">
                        <span class="control-label">Primary</span>
                        <input type="color" class="color-picker" id="primary-color" value="#ffffff">
                    </div>
                    <div class="control-group">
                        <span class="control-label">Stitching</span>
                        <input type="color" class="color-picker" id="secondary-color" value="#333333">
                    </div>
                </div>
            </div>
        </div>
        <div class="resize-handle resize-h"></div>
        <div class="bento-row" id="bottom-row">
            <div class="bento-panel" id="panel-3">
                <button class="panel-fs-btn" title="Toggle fullscreen">
                    <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                    <svg class="icon-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 14h6v6M20 10h-6V4M10 14l-7 7M14 10l7-7"/></svg>
                </button>
            </div>
            <div class="resize-handle resize-v"></div>
            <div class="bento-panel" id="panel-4">
                <button class="panel-fs-btn" title="Toggle fullscreen">
                    <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                    <svg class="icon-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 14h6v6M20 10h-6V4M10 14l-7 7M14 10l7-7"/></svg>
                </button>
                <div class="panel-content">
                    <span class="panel-label">Panel 4</span>
                </div>
            </div>
            <div class="resize-handle resize-v"></div>
            <div class="bento-panel" id="panel-5">
                <button class="panel-fs-btn" title="Toggle fullscreen">
                    <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                    <svg class="icon-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 14h6v6M20 10h-6V4M10 14l-7 7M14 10l7-7"/></svg>
                </button>
                <div class="panel-content">
                    <span class="panel-label">Panel 5</span>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="./script.js"></script>
</body>
</html>
