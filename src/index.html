<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnus</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="bento-grid">
        <div class="bento-row" id="top-row">
            <div class="bento-panel" id="panel-shooter">
                <button class="panel-fs-btn" title="Toggle fullscreen">
                    <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                    <svg class="icon-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 14h6v6M20 10h-6V4M10 14l-7 7M14 10l7-7"/></svg>
                </button>
                <canvas class="webgl"></canvas>
                <div class="vector-legend" id="vector-legend">
                    <span class="dot v-velocity"></span><span>Velocity</span>
                    <span class="dot v-drag"></span><span>Drag</span>
                    <span class="dot v-magnus"></span><span>Magnus</span>
                    <span class="dot v-gravity"></span><span>Gravity</span>
                    <span class="dot v-wind"></span><span>Wind</span>
                </div>
                <div class="debug-overlay" id="debug-overlay"></div>
                <div class="debug-hint" id="debug-hint">Press <kbd>H</kbd> for debug menu</div>
                <button class="debug-toggle-btn" id="debug-toggle-btn" title="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
                <!-- Mobile edit mode button -->
                <button class="edit-mode-btn" id="edit-mode-btn" title="Edit ball design">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
                </button>
                <!-- Mobile spin preview button -->
                <button class="spin-mode-btn" id="spin-mode-btn" title="Spin preview">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10"/><path d="M2 12h20"/></svg>
                </button>
            </div>
            <div class="resize-handle resize-v"></div>
            <div class="bento-panel" id="panel-customizer">
                <button class="edit-mode-done" id="edit-mode-done">Done</button>
                <button class="panel-reset-btn" id="panel-reset-btn" title="Reset panel colors" style="display:none">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 22v-6h6"/></svg>
                </button>
                <div class="panel-color-swatch" id="panel-color-btn" title="Pick panel color" style="display:none"></div>
                <input type="color" id="panel-color-input" style="position:absolute;visibility:hidden;width:0;height:0;pointer-events:none">
                <button class="panel-fs-btn" title="Toggle fullscreen">
                    <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                    <svg class="icon-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 14h6v6M20 10h-6V4M10 14l-7 7M14 10l7-7"/></svg>
                </button>
                <div class="customizer-viewport">
                    <canvas class="customizer-preview"></canvas>
                </div>
                <div class="customizer-controls">
                    <div class="quick-tray">
                        <div class="quick-switch-row">
                            <div class="view-stack">
                                <span class="control-label">VIEW MODE</span>
                                <div class="segment segment-view">
                                    <button class="view-btn active" data-view="ball">3D</button>
                                    <button class="view-btn" data-view="flat">PANEL</button>
                                </div>
                            </div>
                            <div class="design-stack">
                                <span class="control-label">BALL DESIGN</span>
                                <div class="segment segment-design">
                                    <button class="design-btn active" data-design="classic">CLASSIC</button>
                                    <button class="design-btn" data-design="jabulani">JABULANI</button>
                                    <button class="design-btn" data-design="brazuca">BRAZUCA</button>
                                    <button class="design-btn" data-design="trionda">TRIONDA</button>
                                </div>
                            </div>
                        </div>

                        <div class="quick-controls-row">
                            <div class="quick-explode">
                                <span class="control-label">EXPLOSION VIEW</span>
                                <input type="range" id="explode-slider" min="0" max="1" step="0.005" value="0">
                            </div>

                            <div class="quick-bottom-row">
                                <div class="color-token">
                                    <span class="control-label">PRIMARY</span>
                                    <input type="color" class="color-picker square" id="primary-color" value="#ffffff" title="Primary">
                                </div>
                                <div class="color-token">
                                    <span class="control-label">SECONDARY</span>
                                    <input type="color" class="color-picker square" id="secondary-color" value="#333333" title="Secondary">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="detailed-tray">
                        <div class="studio-toolbar">
                            <button class="tb-btn active" data-tool="select" title="Select panel">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
                                <span class="tb-label">Select</span>
                            </button>
                            <button class="tb-btn" data-tool="fill" title="Fill panel">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                                <span class="tb-label">Fill</span>
                            </button>
                            <button class="tb-btn" data-tool="symmetricFill" title="Fill matching panels">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/><line x1="4" y1="12" x2="20" y2="12" stroke-dasharray="2 2"/></svg>
                                <span class="tb-label">Mirror</span>
                            </button>
                            <button class="tb-btn" data-tool="brush" title="Paint on ball">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.06 11.9l8.07-8.06a2.85 2.85 0 114.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 00-3-3.02z"/></svg>
                                <span class="tb-label">Brush</span>
                            </button>
                            <button class="tb-btn" data-tool="shape" title="Stamp shape">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12,2 22,20 2,20"/></svg>
                                <span class="tb-label">Shape</span>
                            </button>
                            <button class="tb-btn" data-tool="mirrorShape" title="Stamp shape mirrored">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12,2 22,20 2,20"/><line x1="12" y1="1" x2="12" y2="23" stroke-dasharray="2 2"/></svg>
                                <span class="tb-label">Mirror&nbsp;Shape</span>
                            </button>

                            <div class="studio-toolbar-divider"></div>

                            <div class="tb-color-group">
                                <div class="tb-color-well">
                                    <input type="color" class="tb-color" id="primary-color-detail" value="#ffffff">
                                    <span class="tb-label">Base</span>
                                </div>
                                <div class="tb-color-well">
                                    <input type="color" class="tb-color" id="secondary-color-detail" value="#333333">
                                    <span class="tb-label">Seam</span>
                                </div>
                                <div class="tb-color-well">
                                    <input type="color" class="tb-color tb-active-color" id="tb-paint-color" value="#cc2233">
                                    <span class="tb-label">Paint</span>
                                </div>
                            </div>

                            <div class="studio-toolbar-divider"></div>

                            <div class="tb-brush-controls" id="tb-brush-controls" style="display:none">
                                <label class="tb-slider-group">
                                    <span class="tb-label">Size</span>
                                    <input type="range" class="tb-range" id="tb-brush-size" min="2" max="40" value="12">
                                </label>
                            </div>

                            <div class="tb-shape-controls" id="tb-shape-controls" style="display:none">
                                <div class="tb-shape-picker">
                                    <button class="tb-shape-opt active" data-shape="star" title="Star">&#9733;</button>
                                    <button class="tb-shape-opt" data-shape="circle" title="Circle">&#9679;</button>
                                    <button class="tb-shape-opt" data-shape="diamond" title="Diamond">&#9670;</button>
                                    <button class="tb-shape-opt" data-shape="hexagon" title="Hexagon">&#11042;</button>
                                    <button class="tb-shape-opt" data-shape="pentagon" title="Pentagon">&#11039;</button>
                                    <button class="tb-shape-opt" data-shape="triangle" title="Triangle">&#9650;</button>
                                    <button class="tb-shape-opt" data-shape="swoosh" title="Swoosh">&#10077;</button>
                                    <button class="tb-shape-opt" data-shape="wave" title="Wave">&#8776;</button>
                                    <button class="tb-shape-opt" data-shape="stripe" title="Stripe">&#9644;</button>
                                    <button class="tb-shape-opt" data-shape="mapleLeaf" title="Maple Leaf">&#127809;</button>
                                    <button class="tb-shape-opt" data-shape="eagle" title="Eagle">&#129413;</button>
                                </div>
                                <label class="tb-slider-group">
                                    <span class="tb-label">Size</span>
                                    <input type="range" class="tb-range" id="tb-shape-size" min="5" max="60" value="25">
                                </label>
                            </div>

                            <div class="studio-toolbar-divider"></div>

                            <div class="tb-design-group">
                                <button class="tb-design-btn design-btn active" data-design="classic">Classic</button>
                                <button class="tb-design-btn design-btn" data-design="jabulani">Jabulani</button>
                                <button class="tb-design-btn design-btn" data-design="brazuca">Brazuca</button>
                                <button class="tb-design-btn design-btn" data-design="trionda">Trionda</button>
                            </div>

                            <div class="studio-toolbar-divider"></div>

                            <div class="tb-view-group">
                                <button class="tb-view-btn view-btn active" data-view="ball">3D</button>
                                <button class="tb-view-btn view-btn" data-view="flat">Panel</button>
                            </div>

                            <div style="position:relative">
                                <button class="tb-btn" id="tb-explode-toggle" title="Explode view">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></svg>
                                    <span class="tb-label">Explode</span>
                                </button>
                                <div class="tb-explode-slider" id="tb-explode-slider">
                                    <span class="tb-explode-label">Explode</span>
                                    <input type="range" id="explode-slider-detail" min="0" max="1" step="0.005" value="0">
                                </div>
                            </div>

                            <div class="studio-toolbar-divider"></div>

                            <button class="tb-btn" id="studio-reset-btn" title="Reset">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 22v-6h6"/></svg>
                                <span class="tb-label">Reset</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="resize-handle resize-h"></div>
        <div class="bento-row" id="bottom-row">
            <div class="bento-panel" id="panel-spin-preview">
                <button class="spin-mode-done" id="spin-mode-done">Done</button>
                <button class="panel-fs-btn" title="Toggle fullscreen">
                    <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                    <svg class="icon-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 14h6v6M20 10h-6V4M10 14l-7 7M14 10l7-7"/></svg>
                </button>
                <canvas class="spin-preview-canvas"></canvas>
                <div class="spin-preview-label">Spin Preview</div>
            </div>
            <div class="resize-handle resize-v"></div>
            <div class="bento-panel" id="panel-birdseye">
                <button class="panel-fs-btn" title="Toggle fullscreen">
                    <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                    <svg class="icon-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 14h6v6M20 10h-6V4M10 14l-7 7M14 10l7-7"/></svg>
                </button>
                <canvas class="birdseye-canvas"></canvas>
                <div class="birdseye-label">Birdseye Tracker</div>
            </div>
            <div class="resize-handle resize-v"></div>
            <div class="bento-panel" id="panel-flight-dynamics">
                <button class="panel-fs-btn" title="Toggle fullscreen">
                    <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                    <svg class="icon-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 14h6v6M20 10h-6V4M10 14l-7 7M14 10l7-7"/></svg>
                </button>
                <canvas class="flight-dynamics-canvas"></canvas>
                <div class="flight-dynamics-stats">
                    <div class="flight-dynamics-stat"><span>Peak V</span><strong id="metric-power">--</strong></div>
                    <div class="flight-dynamics-stat"><span>Avg Cd</span><strong id="metric-curve">--</strong></div>
                    <div class="flight-dynamics-stat"><span>Max Cl</span><strong id="metric-spin">--</strong></div>
                    <div class="flight-dynamics-stat"><span>Reynolds</span><strong id="metric-target">--</strong></div>
                </div>
                <div class="flight-dynamics-label">Flight Dynamics</div>
            </div>
        </div>
    </div>
    <script type="module" src="./main.js"></script>
</body>
</html>
