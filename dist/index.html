<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <div class="bento-grid">
        <div class="bento-row" id="top-row">
            <div class="bento-panel" id="panel-shooter">
                <button class="panel-fs-btn" title="Toggle fullscreen">

                <!-- Mobile spin preview button -->
                <button class="spin-mode-btn" id="spin-mode-btn" title="Spin preview">

            <div class="resize-handle resize-v"></div>
            <div class="bento-panel" id="panel-customizer">

                <button class="panel-reset-btn" id="panel-reset-btn" title="Reset panel colors" style="display:none">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 22v-6h6"/></svg>
                </button>
                <div class="panel-color-swatch" id="panel-color-btn" title="Pick panel color" style="display:none"></div>
                <input type="color" id="panel-color-input" style="position:absolute;visibility:hidden;width:0;height:0;pointer-events:none">
                <button class="panel-fs-btn" title="Toggle fullscreen">

                </button>
                <div class="customizer-viewport">
                    <canvas class="customizer-preview"></canvas>
                </div>
                <div class="customizer-controls">
                    <div class="quick-tray">
                        <div class="quick-switch-row">
                            <div class="view-stack">
                                <span class="control-label">VIEW MODE</span>
                                <div class="segment segment-view">
                                    <button class="view-btn active" data-view="ball">3D</button>
                                    <button class="view-btn" data-view="flat">PANEL</button>
                                </div>
                            </div>
                            <div class="design-stack">
                                <span class="control-label">BALL DESIGN</span>
                                <div class="segment segment-design">
                                    <button class="design-btn active" data-design="classic">CLASSIC</button>
                                    <button class="design-btn" data-design="jabulani">JABULANI</button>
                                    <button class="design-btn" data-design="brazuca">BRAZUCA</button>
                                    <button class="design-btn" data-design="trionda">TRIONDA</button>
                                </div>
                            </div>
                        </div>

                        <div class="quick-controls-row">
                            <div class="quick-explode">
                                <span class="control-label">EXPLOSION VIEW</span>
                                <input type="range" id="explode-slider" min="0" max="1" step="0.005" value="0">
                            </div>

                            <div class="quick-bottom-row">
                                <div class="color-token">
                                    <span class="control-label">PRIMARY</span>
                                    <input type="color" class="color-picker square" id="primary-color" value="#ffffff" title="Primary">
                                </div>
                                <div class="color-token">
                                    <span class="control-label">SECONDARY</span>
                                    <input type="color" class="color-picker square" id="secondary-color" value="#333333" title="Secondary">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="detailed-tray">
                        <div class="studio-toolbar">
                            <!-- Select tool -->
                            <button class="tb-btn active" data-tool="select" title="Select panel">

                            </button>
                            <!-- Fill tool -->
                            <button class="tb-btn" data-tool="fill" title="Fill panel with color">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                            </button>
                            <!-- Symmetric fill tool -->
                            <button class="tb-btn" data-tool="symmetricFill" title="Fill all matching panels">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/><path d="M7 2l-3 3 3 3"/><path d="M17 2l3 3-3 3"/></svg>
                            </button>

                            <div class="studio-toolbar-divider"></div>

                            <!-- Color wells -->
                            <input type="color" class="tb-color" id="primary-color-detail" value="#ffffff" title="Primary">
                            <input type="color" class="tb-color" id="secondary-color-detail" value="#333333" title="Secondary">

                            <!-- Color swatches dropdown -->
                            <div style="position:relative">
                                <button class="tb-btn" id="tb-swatch-toggle" title="Quick colors">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20"/><line x1="12" y1="2" x2="12" y2="22"/><path d="M2 12h20"/></svg>
                                </button>
                                <div class="tb-dropdown" id="tb-swatch-dropdown">
                                    <div class="tb-dropdown-label">Quick Colors</div>
                                    <div class="tb-swatch-grid" id="tb-swatch-grid">
                                        <button class="tb-swatch" data-color="#ffffff" style="background:#ffffff"></button>
                                        <button class="tb-swatch" data-color="#cccccc" style="background:#cccccc"></button>
                                        <button class="tb-swatch" data-color="#666666" style="background:#666666"></button>
                                        <button class="tb-swatch" data-color="#333333" style="background:#333333"></button>
                                        <button class="tb-swatch" data-color="#111111" style="background:#111111"></button>
                                        <button class="tb-swatch" data-color="#000000" style="background:#000000"></button>
                                        <button class="tb-swatch" data-color="#cc2233" style="background:#cc2233"></button>
                                        <button class="tb-swatch" data-color="#ee5522" style="background:#ee5522"></button>
                                        <button class="tb-swatch" data-color="#f0c020" style="background:#f0c020"></button>
                                        <button class="tb-swatch" data-color="#22aa44" style="background:#22aa44"></button>
                                        <button class="tb-swatch" data-color="#2266cc" style="background:#2266cc"></button>
                                        <button class="tb-swatch" data-color="#8833cc" style="background:#8833cc"></button>
                                    </div>
                                </div>
                            </div>

                            <div class="studio-toolbar-divider"></div>

                            <!-- Pattern dropdown -->
                            <div style="position:relative">
                                <button class="tb-btn" id="tb-pattern-toggle" title="Patterns">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                                </button>
                                <div class="tb-dropdown" id="tb-pattern-dropdown" style="min-width:220px">
                                    <div class="tb-dropdown-label">Patterns</div>
                                    <div id="tb-pattern-list"></div>
                                </div>
                            </div>

                            <div class="studio-toolbar-divider"></div>

                            <!-- View toggle -->
                            <div class="tb-view-group">
                                <button class="tb-view-btn view-btn active" data-view="ball">3D</button>
                                <button class="tb-view-btn view-btn" data-view="flat">Panel</button>
                            </div>

                            <!-- Explode (icon + vertical slider popup) -->
                            <div style="position:relative">
                                <button class="tb-btn" id="tb-explode-toggle" title="Explode view">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>
                                </button>
                                <div class="tb-explode-slider" id="tb-explode-slider">
                                    <input type="range" id="explode-slider-detail" min="0" max="1" step="0.005" value="0">
                                </div>
                            </div>

                            <div class="studio-toolbar-divider"></div>

                            <!-- Reset -->
                            <button class="tb-btn" id="studio-reset-btn" title="Reset colors">

        <div class="resize-handle resize-h"></div>

                <div class="spin-preview-label">Spin Preview</div>
            </div>
            <div class="resize-handle resize-v"></div>
            <div class="bento-panel" id="panel-birdseye">
                <button class="panel-fs-btn" title="Toggle fullscreen">
                    <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>

                </button>
                <canvas class="birdseye-canvas"></canvas>
                <div class="birdseye-label">Birdseye Tracker</div>
            </div>
            <div class="resize-handle resize-v"></div>
            <div class="bento-panel" id="panel-flight-dynamics">
                <button class="panel-fs-btn" title="Toggle fullscreen">
                    <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                    <svg class="icon-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 14h6v6M20 10h-6V4M10 14l-7 7M14 10l7-7"/></svg>
                </button>
                <canvas class="flight-dynamics-canvas"></canvas>
                <div class="flight-dynamics-stats">
                    <div class="flight-dynamics-stat"><span>Peak V</span><strong id="metric-power">--</strong></div>
                    <div class="flight-dynamics-stat"><span>Avg Cd</span><strong id="metric-curve">--</strong></div>
                    <div class="flight-dynamics-stat"><span>Max Cl</span><strong id="metric-spin">--</strong></div>
                    <div class="flight-dynamics-stat"><span>Reynolds</span><strong id="metric-target">--</strong></div>
                </div>
                <div class="flight-dynamics-label">Flight Dynamics</div>
            </div>
        </div>
    </div>
</body>
